name: Build and Test
on: [push]
permissions:
  contents: read

jobs:
  bat:
    name: Build and Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - name: Perform npm tasks
        run: npm run ci
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: built-action
          path: |
            **/*
            !node_modules/
  integ:
    needs: bat
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest, macos-14]
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: built-action

      - name: Perform 'setup-matlab'
        uses: matlab-actions/setup-matlab@a0180c939fb1a28de13f44f7b778b912384ced1f # v3.0.1
        with:
          products: MATLAB_Test

      - name: Create buildfile.m in project root for tests
        shell: bash
        run: |
          cat <<'_EOF' >> "buildfile.m"
            function plan = buildfile
            import matlab.buildtool.tasks.TestTask

            plan = buildplan(localfunctions);
            plan("preMadeTest") = TestTask;
            plan("preMadeTest").Dependencies = "build";
            plan("preMadeTest_1") = TestTask;
            plan("preMadeTest_1").Dependencies = "build";
            plan("preMadeTest_2") = TestTask;
            plan("preMadeTest_2").Dependencies = "build";
            plan("test").Dependencies = "build";
            plan("deploy").Dependencies = "test";
            % task with Outputs so .buildtool/ is created
            plan("artifact").Outputs = "artifactOutput.txt";

            plan.DefaultTasks = "test";
            end

            function buildTask(~)
            f = fopen('buildlog.txt', 'a+'); fprintf(f, 'building\n'); fclose(f);
            end

            function testTask(~,tests,options)
            arguments
              ~
              tests string = "tests"
              options.OutputDetail (1,1) string = "terse"
            end
            f = fopen('buildlog.txt', 'a+');
            fprintf(f, 'testing\n');
            fprintf(f, '%s\n', tests);
            fprintf(f, '%s\n', options.OutputDetail);
            fclose(f);
            end

            function deployTask(~)
            f = fopen('buildlog.txt', 'a+'); fprintf(f, 'deploying\n'); fclose(f);
            end

            function checkTask(~)
            f = fopen('buildlog.txt', 'a+'); fprintf(f, 'checking\n'); fclose(f);
            end

            function artifactTask(~)
            f = fopen('artifactOutput.txt', 'w'); fprintf(f, 'artifact\n'); fclose(f);
            f = fopen('buildlog.txt', 'a+'); fprintf(f, 'artifacting\n'); fclose(f);
            end
            
            function errorTask(~)
            f = fopen('buildlog.txt', 'a+'); fprintf(f, 'erroring\n'); fclose(f);
            error('Error occured in errorTask');
            end
          _EOF

      - name: Run build with default tasks
        uses: ./

      - name: Verify correct tasks appear in buildlog.txt
        shell: bash
        run: |
          set -e
          grep "building" buildlog.txt
          grep "testing" buildlog.txt
          grep "tests" buildlog.txt
          grep "terse" buildlog.txt
          ! grep "deploying" buildlog.txt
          ! grep "checking" buildlog.txt
          rm buildlog.txt

      - name: Run build with specified task
        uses: ./
        with:
          tasks: deploy

      - name: Verify correct tasks appear in buildlog.txt
        shell: bash
        run: |
          set -e
          grep "building" buildlog.txt
          grep "testing" buildlog.txt
          grep "tests" buildlog.txt
          grep "terse" buildlog.txt
          grep "deploying" buildlog.txt
          ! grep "checking" buildlog.txt
          rm buildlog.txt

      - name: Run build with multiple specified tasks
        uses: ./
        with:
          tasks: deploy check

      - name: Verify correct tasks appear in buildlog.txt
        shell: bash
        run: |
          set -e
          grep "building" buildlog.txt
          grep "testing" buildlog.txt
          grep "tests" buildlog.txt
          grep "terse" buildlog.txt
          grep "deploying" buildlog.txt
          grep "checking" buildlog.txt
          rm buildlog.txt

      - name: Run build with task args
        uses: ./
        with:
          tasks: test("myTests", OutputDetail="concise")

      - name: Verify correct tasks appear in buildlog.txt
        shell: bash
        run: |
          set -e
          grep "building" buildlog.txt
          grep "testing" buildlog.txt
          grep "myTests" buildlog.txt
          grep "concise" buildlog.txt
          ! grep "deploying" buildlog.txt
          ! grep "checking" buildlog.txt
          rm buildlog.txt

      - name: Run build with startup options
        uses: ./
        with:
          startup-options: -logfile console.log

      - name: Verify tasks appear in buildlog.txt and console.log
        shell: bash
        run: |
          set -e
          grep "building" buildlog.txt
          grep "build" console.log
          grep "testing" buildlog.txt
          grep "tests" buildlog.txt
          grep "terse" buildlog.txt
          grep "test" console.log
          ! grep "deploying" buildlog.txt
          ! grep "deploy" console.log
          ! grep "checking" buildlog.txt
          ! grep "check" console.log
          rm buildlog.txt
          rm console.log

      - name: Run build with task skipping
        uses: ./
        with:
          tasks: deploy
          build-options: -skip test

      - name: Verify correct tasks appear in buildlog.txt
        shell: bash
        run: |
          set -e
          grep "building" buildlog.txt
          ! grep "testing" buildlog.txt
          ! grep "tests" buildlog.txt
          ! grep "terse" buildlog.txt
          grep "deploying" buildlog.txt
          ! grep "checking" buildlog.txt
          rm buildlog.txt

      - name: Run build with continue on failure
        continue-on-error: true
        uses: ./
        with:
          tasks: error deploy
          build-options: -continueOnFailure

      - name: Verify correct tasks appear in buildlog.txt
        shell: bash
        run: |
          set -e
          grep "erroring" buildlog.txt
          grep "building" buildlog.txt
          grep "testing" buildlog.txt
          grep "tests" buildlog.txt
          grep "terse" buildlog.txt
          grep "deploying" buildlog.txt
          ! grep "checking" buildlog.txt
          rm buildlog.txt

      - name: Run build with startup options
        continue-on-error: true
        uses: ./
        with:
          tasks: deploy error
          build-options: -continueOnFailure
          startup-options: -logfile console.log

      - name: Verify workflow command is added
        shell: bash
        run: |
          grep "::group::deploy" console.log
          grep "::error::error task failed" console.log
          rm console.log

      - name: Run build with premade TestTask for test summary
        uses: ./
        with:
          tasks: preMadeTest

      - name: Run build with premade TestTask ran multiple times for test summary sanity
        uses: ./
        with:
          tasks: preMadeTest preMadeTest_1 preMadeTest_2

      - name: Run build with invalid task
        continue-on-error: true
        uses: ./
        with:
          tasks: badTask
          build-options: -continueOnFailure
          startup-options: -logfile console.log

      - name: Verify summary exception for invalid task
        shell: bash
        run: |
          set -e
          ! grep "while reading the build summary file:" console.log
          ! grep "trying to delete the build summary" console.log
          rm console.log

      # Smoke test for the cache input
      - name: Run build with caching enabled
        uses: ./
        with:
          tasks: artifact
          cache: true

      - name: Verify the build ran
        shell: bash
        run: |
          set -e
          grep "artifacting" buildlog.txt
          test -d .buildtool
          rm buildlog.txt artifactOutput.txt

  cache-save:
    name: Test cache save
    needs: bat
    runs-on: ubuntu-latest
    env:
      WRITE_JOB: cacheWrite-${{ github.run_id }}-${{ github.run_attempt }}
      NO_WRITE_JOB: cacheNoWrite-${{ github.run_id }}-${{ github.run_attempt }}
      DEFAULT_BRANCH_REF: refs/heads/${{ github.event.repository.default_branch }}
      NON_DEFAULT_BRANCH_REF: refs/heads/not-the-default-branch
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: built-action

      - name: Perform 'setup-matlab'
        uses: matlab-actions/setup-matlab@a0180c939fb1a28de13f44f7b778b912384ced1f # v3.0.1
        with:
          release: latest-including-prerelease

      - name: Create buildfile.m in project root for tests
        shell: bash
        run: |
          cat <<'_EOF' >> "buildfile.m"
            function plan = buildfile
            plan = buildplan(localfunctions);
            % task with Outputs so .buildtool/ is created
            plan("artifact").Outputs = "artifactOutput.txt";
            plan.DefaultTasks = "artifact";
            end

            function artifactTask(~)
            f = fopen('artifactOutput.txt', 'w'); fprintf(f, 'artifact\n'); fclose(f);
            f = fopen('buildlog.txt', 'a+'); fprintf(f, 'artifacting\n'); fclose(f);
            end
          _EOF

      - name: Run build with caching enabled on the default branch
        uses: ./
        with:
          tasks: artifact
          build-options: -outputCache
          cache: true
        env:
          GITHUB_JOB: ${{ env.WRITE_JOB }}
          GITHUB_REF: ${{ env.DEFAULT_BRANCH_REF }}

      - name: Verify the build ran
        shell: bash
        run: |
          set -e
          grep "artifacting" buildlog.txt
          test -d .buildtool
          rm buildlog.txt

      - name: Run build with caching enabled on a non-default branch
        uses: ./
        with:
          tasks: artifact
          build-options: -outputCache
          cache: true
        env:
          GITHUB_JOB: ${{ env.NO_WRITE_JOB }}
          GITHUB_REF: ${{ env.NON_DEFAULT_BRANCH_REF }}

      - name: Add a marker file to .buildtool
        shell: bash
        run: echo "${{ github.run_id }}-${{ github.run_attempt }}" > .buildtool/cache-marker.txt

  cache-restore:
    name: Test cache restore
    needs: cache-save
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: write # read to list the caches, write to delete them afterwards
    env:
      GH_TOKEN: ${{ github.token }}
      WRITE_JOB: cacheWrite-${{ github.run_id }}-${{ github.run_attempt }}
      NO_WRITE_JOB: cacheNoWrite-${{ github.run_id }}-${{ github.run_attempt }}
      NON_DEFAULT_BRANCH_REF: refs/heads/not-the-default-branch
      MARKER: ${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - name: Verify 'cache-save' saved a cache for the default branch only
        shell: bash
        run: |
          set -e
          # '--key' matches on key prefix, and gh fails when nothing matches
          list_keys() {
            gh cache list --key "$1" --limit 100 --json key --jq ".[].key" || true
          }
          write_keys=$(list_keys "matlab-buildtool-Linux-$WRITE_JOB-")
          no_write_keys=$(list_keys "matlab-buildtool-Linux-$NO_WRITE_JOB-")
          echo "default branch keys: [$write_keys]"
          echo "non-default branch keys: [$no_write_keys]"
          test "$(printf "%s" "$write_keys" | grep -c .)" -eq 1
          test -z "$no_write_keys"
          # the key identifies the commit that was built
          case "$write_keys" in
            *-"$GITHUB_SHA") ;;
            *) echo "unexpected cache key"; exit 1 ;;
          esac
          echo "CACHE_KEY=$write_keys" >> "$GITHUB_ENV"

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: built-action

      - name: Perform 'setup-matlab'
        uses: matlab-actions/setup-matlab@a0180c939fb1a28de13f44f7b778b912384ced1f # v3.0.1
        with:
          release: latest-including-prerelease

      - name: Create buildfile.m in project root for tests
        shell: bash
        run: |
          cat <<'_EOF' >> "buildfile.m"
            function plan = buildfile
            plan = buildplan(localfunctions);
            % task with Outputs so .buildtool/ is created
            plan("artifact").Outputs = "artifactOutput.txt";
            plan.DefaultTasks = "artifact";
            end

            function artifactTask(~)
            f = fopen('artifactOutput.txt', 'w'); fprintf(f, 'artifact\n'); fclose(f);
            f = fopen('buildlog.txt', 'a+'); fprintf(f, 'artifacting\n'); fclose(f);
            end
          _EOF

      - name: Verify .buildtool does not exist yet
        shell: bash
        run: test ! -d .buildtool

      - name: Run build with a cache hit on the primary key
        uses: ./
        with:
          tasks: artifact
          build-options: -outputCache
          cache: true
        env:
          GITHUB_JOB: ${{ env.WRITE_JOB }}
          GITHUB_REF: ${{ env.NON_DEFAULT_BRANCH_REF }}

      - name: Verify the cache was restored and the task was not rerun
        shell: bash
        run: |
          set -e
          # the marker file can only have come from the restored cache
          test "$(cat .buildtool/cache-marker.txt)" = "$MARKER"
          # the output was fetched from the restored output cache, so the task
          # itself never ran and never appended to buildlog.txt
          test -f artifactOutput.txt
          test ! -f buildlog.txt
          rm -rf .buildtool artifactOutput.txt

      - name: Run build with a cache hit on a restore key
        uses: ./
        with:
          tasks: artifact
          build-options: -outputCache
          cache: true
        env:
          GITHUB_JOB: ${{ env.WRITE_JOB }}
          GITHUB_REF: ${{ env.NON_DEFAULT_BRANCH_REF }}
          # a commit that was never cached, so only a restore key can match
          GITHUB_SHA: "0000000000000000000000000000000000000000"

      - name: Verify the cache was restored from the restore key
        shell: bash
        run: |
          set -e
          test "$(cat .buildtool/cache-marker.txt)" = "$MARKER"
          test -f artifactOutput.txt
          test ! -f buildlog.txt

      - name: Delete the cache created by this run
        if: always()
        shell: bash
        run: |
          if [ -n "${CACHE_KEY:-}" ]; then
            gh cache delete "$CACHE_KEY" || true
          fi
