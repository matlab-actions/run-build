name: Run MATLAB Build
description: >-
  Run a build with the MATLAB build tool
inputs:
  tasks:
    description: >-
      Space-separated list of tasks to run
    required: false
    default: ""
  build-options:
    description: >-
      Build options for MATLAB build tool
    required: false
    default: ""
  startup-options:
    description: >-
      Startup options for MATLAB
    required: false
    default: ""
  cache:
    description: >-
      Option to cache the .buildtool folder to speed up subsequent builds
    required: false
    default: false
  generate-summary:
    description: >-
      Option to generate a summary for the GitHub job summary
    required: false
    default: true
  # The following input is internal and should not be modified.
  job-matrix-json:
    description: >-
      Used to construct the cache key. Do not modify this input directly.
    required: false
    default: ${{ toJSON(matrix) }}
runs:
  using: node24
  main: dist/index.js
  post: dist/post/index.js
  post-if: success()
